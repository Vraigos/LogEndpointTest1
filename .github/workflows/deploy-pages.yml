name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare static site for GitHub Pages
        run: |
          set -euo pipefail
          STATIC=".vercel/output/static"
          BASE="/LogEndpoint"

          if [ ! -d "$STATIC" ]; then
            echo "Missing $STATIC — build did not produce static assets"
            ls -la .vercel/output || true
            exit 1
          fi

          JS=$(find "$STATIC/assets" -name 'index-*.js' | head -1 | xargs -r basename)
          CSS=$(find "$STATIC/assets" -name 'styles-*.css' | head -1 | xargs -r basename)
          ROUTES=$(find "$STATIC/assets" -name 'routes-*.js' | head -1 | xargs -r basename)

          echo "JS=$JS CSS=$CSS ROUTES=$ROUTES"

          if [ -z "$JS" ]; then
            echo "No index-*.js found under $STATIC/assets"
            find "$STATIC" -type f
            exit 1
          fi

          CSS_LINK=""
          if [ -n "$CSS" ]; then
            CSS_LINK="<link rel=\"stylesheet\" href=\"${BASE}/assets/${CSS}\" />"
          fi

          cat > "$STATIC/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Issue Drop</title>
            <link rel="icon" type="image/svg+xml" href="${BASE}/favicon.svg" />
            ${CSS_LINK}
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="${BASE}/assets/${JS}"></script>
            <noscript>This app needs JavaScript.</noscript>
          </body>
          </html>
          HTML

          # Normalize leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' "$STATIC/index.html"

          cp "$STATIC/index.html" "$STATIC/404.html"

          echo "Prepared index.html + 404.html"
          ls -la "$STATIC"
          head -25 "$STATIC/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
